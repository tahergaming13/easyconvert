<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EasyConvert — free, private, in-browser file converter. Images to PDF, PDF to images, merge, split, compress, rotate, convert image formats. No uploads, no backend." />
    <meta name="theme-color" content="#6366f1" />
    <title>EasyConvert — Image ↔ PDF & All File Tools (Free, No Upload)</title>
    <script>
      try {
        var t = localStorage.getItem('easyconvert-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
